name: Verify and package for Ubuntu
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node --test tests/*.test.mjs
      - run: npm run build
      - name: Assemble standalone (no credentials)
        run: |
          mkdir -p .next/standalone/.next
          cp -R public .next/standalone/public
          cp -R .next/static .next/standalone/.next/static
          cp deploy/start-server.cjs .next/standalone/start-server.cjs
          tar --exclude='.env*' --exclude='*.pem' --exclude='*.key' -czf yakmi-linux.tar.gz -C .next/standalone .
      - uses: actions/upload-artifact@v4
        with:
          name: yakmi-ubuntu-node24
          path: yakmi-linux.tar.gz
          retention-days: 7

